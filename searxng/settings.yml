# Minimal SearXNG config for FrogFind; everything else uses SearXNG's defaults.
use_default_settings: true

server:
  # real key comes from SEARXNG_SECRET in .env
  secret_key: "ultrasecretkey"
  # only FrogFind talks to this instance (no published port), so no bot limiter needed
  limiter: false

search:
  # FrogFind reads the JSON API
  formats:
    - html
    - json

# Both CAPTCHA/rate-limit self-hosted instances; the other engines cover for them.
# Disabled rather than removed: brave's image/news/video engines share its network settings.
engines:
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true

  # Off by default in SearXNG; tested working from a self-hosted instance.
  # (google = "access denied", qwant = CAPTCHA, privacywall = timeouts, so left off)
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: mwmbl
    disabled: false
  - name: yep
    disabled: false
